type:
  - family: Schibsted Grotesk
    use: display
    roles:
      - display
    weights:
      - regular
    character: Greg's name and article titles, section labels, in-text headings; nav and article-footer links; tool names
    usage: 'Three faces, at regular weight unless noted.


      | Face | Role | Main size |

      |---|---|---|

      | **Schibsted Grotesk** | Greg''s name and article titles, section labels, in-text headings; nav and article-footer links; tool names | 19px for names, titles, and labels; 12 to 13px for links and tool names |

      | **Libre Franklin** | Body text, article subtitles, card and row titles and descriptions, the footer | 15px body; 14px in cards and rows (titles at medium weight) |

      | **DM Mono** | The header meta line, article eyebrows, row numbers and card meta, spec panels, inline code | 11 to 13px |


      - **Hierarchy comes mainly from face and gray.** Greg''s name and section labels are the same size; nothing on a page is set large.

      - **Sentence case** for names, labels, titles, and buttons. The one exception: short monospace labels (row numbers, card meta, the "More" label) may be set in all caps as a small-label style. The links in the header''s meta line are set in lowercase ("copy email," "linkedin"). Never set Schibsted or Libre Franklin text in all caps.'
    prov:
      src: brand-book, Agency State Brand Guidelines, Typography
      conf: high
      basis: verbatim
    field_prov:
      use: { src: 'brand-book, Agency State Brand Guidelines, Typography', conf: high, basis: confirmed }
      roles: { src: 'brand-book, Agency State Brand Guidelines, Typography', conf: high, basis: confirmed }
      usage:
        src: brand-book, Agency State Brand Guidelines, Typography
        conf: high
        basis: verbatim
      character: { src: 'brand-book, Agency State Brand Guidelines, Typography', conf: high, basis: confirmed }
  - family: Libre Franklin
    use: body
    roles:
      - body
    weights:
      - regular
      - medium
    character: Body text, article subtitles, card and row titles and descriptions, the footer
    usage: 'Three faces, at regular weight unless noted.


      | Face | Role | Main size |

      |---|---|---|

      | **Schibsted Grotesk** | Greg''s name and article titles, section labels, in-text headings; nav and article-footer links; tool names | 19px for names, titles, and labels; 12 to 13px for links and tool names |

      | **Libre Franklin** | Body text, article subtitles, card and row titles and descriptions, the footer | 15px body; 14px in cards and rows (titles at medium weight) |

      | **DM Mono** | The header meta line, article eyebrows, row numbers and card meta, spec panels, inline code | 11 to 13px |


      - **Hierarchy comes mainly from face and gray.** Greg''s name and section labels are the same size; nothing on a page is set large.

      - **Sentence case** for names, labels, titles, and buttons. The one exception: short monospace labels (row numbers, card meta, the "More" label) may be set in all caps as a small-label style. The links in the header''s meta line are set in lowercase ("copy email," "linkedin"). Never set Schibsted or Libre Franklin text in all caps.'
    prov:
      src: brand-book, Agency State Brand Guidelines, Typography
      conf: high
      basis: verbatim
    field_prov:
      use: { src: 'brand-book, Agency State Brand Guidelines, Typography', conf: high, basis: confirmed }
      roles: { src: 'brand-book, Agency State Brand Guidelines, Typography', conf: high, basis: confirmed }
      usage:
        src: brand-book, Agency State Brand Guidelines, Typography
        conf: high
        basis: verbatim
      character: { src: 'brand-book, Agency State Brand Guidelines, Typography', conf: high, basis: confirmed }
  - family: DM Mono
    use: mono
    roles:
      - mono
      - spec
    weights:
      - regular
    character: The header meta line, article eyebrows, row numbers and card meta, spec panels, inline code
    usage: 'Three faces, at regular weight unless noted.


      | Face | Role | Main size |

      |---|---|---|

      | **Schibsted Grotesk** | Greg''s name and article titles, section labels, in-text headings; nav and article-footer links; tool names | 19px for names, titles, and labels; 12 to 13px for links and tool names |

      | **Libre Franklin** | Body text, article subtitles, card and row titles and descriptions, the footer | 15px body; 14px in cards and rows (titles at medium weight) |

      | **DM Mono** | The header meta line, article eyebrows, row numbers and card meta, spec panels, inline code | 11 to 13px |


      - **Hierarchy comes mainly from face and gray.** Greg''s name and section labels are the same size; nothing on a page is set large.

      - **Sentence case** for names, labels, titles, and buttons. The one exception: short monospace labels (row numbers, card meta, the "More" label) may be set in all caps as a small-label style. The links in the header''s meta line are set in lowercase ("copy email," "linkedin"). Never set Schibsted or Libre Franklin text in all caps.


      **Inline code:** tool and file names inside a sentence use DM Mono. Nothing on a page falls back to a system font.'
    prov:
      src: brand-book, Agency State Brand Guidelines, Typography
      conf: high
      basis: verbatim
    field_prov:
