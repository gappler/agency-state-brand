exemplars:
  - id: context-opening
    label: Context is not control, opening
    text: 'Giving AI your written brand documents can help it write better marketing copy. Those documents become its context: the vocabulary, examples of the voice, product information, and the rules you want it to follow.


      But a draft it writes can sound right while getting important things wrong. It can name a product you don''t sell or promise a policy you don''t offer. I''ve found these errors are different from the ones people make. They fit. They borrow real details, or they sound like what any brand like yours would say. The clues that they''re wrong are there, but only someone who knows the facts will see them.'
    prov:
      src: brand-book, Context is not control
      conf: high
      basis: verbatim
  - id: context-result
    label: Context is not control, result and limits
    text: All three fake drafts passed the rule checks, and the source check flagged all three. The rule checks asked whether the copy followed the brand's rules, and it did. The source check asked whether the product existed, and it didn't. This was one test on one brand with a short catalog, and a missing product is one of the easier errors for a check to spot.
    prov:
      src: brand-book, Context is not control
      conf: high
      basis: verbatim
  - id: context-close
    label: Context is not control, close
    text: 'The brand information gives AI context. Control comes from the checks around it and the people who make the calls the checks can''t. That''s the work a Brand OS does: turning the brand information into a source a check can read, keeping it current, giving it to the AI with every request, running the checks, and routing the remaining decisions to the right person.'
    prov:
      src: brand-book, Context is not control, Where the corrections go
      conf: high
      basis: verbatim
  - id: brand-os-production
    label: What is Brand OS?, Production
    text: 'Production is where the team''s work gets made. The team supplies the brief and the idea; the source supplies the brand guidance for the task. The work covers campaigns and the ongoing production between them: product updates, page revisions, email versions, social posts.


      Agents draft, adapt, localize, and update that material. An email and a social post call for different choices about length, emphasis, and detail, and the agent makes those choices within the brief. Automations handle the set steps around each draft: they run the checks and send the draft to the person who reviews it.'
    prov:
      src: brand-book, What is Brand OS?, 02. Production
      conf: high
      basis: confirmed
  - id: homepage-practice
    label: Homepage, practice introduction
    text: Agency State is my AI Enablement practice for brand marketing teams building their own AI workflows with Claude Code and Codex. The approach starts with the brand. I call it Brand OS, the system that keeps a marketing team's AI work on brand. It improves as the team approves the corrections that come out of the work.
    prov:
      src: brand-book, Agency State homepage
      conf: high
      basis: confirmed
