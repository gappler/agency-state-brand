claims:
  - id: no-fake-proof
    rule: 'Never say: Fake proof. Testimonial-style claims or outcome numbers before the first engagements complete.'
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      rule: { src: 'brand-book, Agency State Brand Platform, 7. Never say', conf: high, basis: confirmed }
    route_to: claims
  - id: no-capability-transfer-promise
    rule: 'Never say: "Capability transfer" or "teaches you to build" as promises. Overstates what an engagement delivers. Greg builds with the team and provides artifacts and documentation, then works with the Brand OS lead as the system grows. That does not transfer capability in a single handoff.'
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      rule: { src: 'brand-book, Agency State Brand Platform, 7. Never say', conf: high, basis: confirmed }
    route_to: claims
  - id: no-negative-positioning
    rule: 'Never say: Negative positioning and unmeasured group claims. No defining Agency State against others ("Unlike enterprise consulting...," "not another AI course") and no characterizing how other brands, teams, or people operate ("most brands," "most teams," "everyone," "nobody"). The defect is asserting a proportion nobody counted, or casting the reader''s peers as the ones getting it wrong. A specific, factual comparison is allowed: name the vendor or category, state what each approach does, and keep every claim verifiable; the superiority has to be visible in the facts, not asserted around them. Lead with what Agency State does, and state a failure by what goes wrong rather than by who has it.'
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      rule: { src: 'brand-book, Agency State Brand Platform, 7. Never say', conf: high, basis: confirmed }
    route_to: claims
  - id: no-os-metaphor-arguments
    rule: 'Never say: Arguments from the OS metaphor. "Brand OS" may label, never argue. No claim is true "because it is an operating system," and no copy derives a property from the metaphor (mandatory, total, invisible, "the layer everything runs through"). The test: replace "Brand OS" with "this setup" and every claim must still hold. The name is a handle for the assembled whole; the definition and the evidence carry the weight.'
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      rule: { src: 'brand-book, Agency State Brand Platform, 7. Never say', conf: high, basis: confirmed }
    route_to: claims
  - id: proof-posture
    rule: 'Proof posture. Agency State makes claims from the right basis. Built artifacts can be described as built. Tests on Agency State and demo brands can be described as tests on Agency State and demo brands. Practice recommendations can be stated as recommendations when they follow from Greg''s brand, marketing operations, and AI implementation work. Name the basis, then move on. The Brand OS parts are built and tested on Agency State''s own work and on demo brands. No Brand OS has yet been built or run end to end for anyone, including Agency State itself, and none has run at a client. Describe how the work is done, including parts still being built, when Greg can deliver them on a short turnaround; present tense is fine for the method ("Automations run the checks and send the draft for review"). Evidence is different: never state a result, a test, a client engagement, or a number that hasn''t happened or been measured.'
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 8. Proof
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: claims
  - id: site-evidence-and-client-results
    rule: 'Site articles name their evidence plainly: a test is called a test, and a demo brand is named as one. They do not state that no Brand OS has been built or run end to end or at a client. Greg discloses that directly with prospective clients. No copy claims or implies client results.'
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 8. Proof
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: claims
  - id: keep-material-limits
    rule: 'Keep material limits with the claim, close enough that the reader can''t miss them: "none of the checks in this test," not "no check."'
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, Writing for Agency State
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: claims
  - id: quiet-public-offer
    rule: Keep the offer quiet. Describe the work and what it has shown. No pricing, packages, or hard offers in public copy; an assessment as the first step can be mentioned plainly.
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, Writing for Agency State
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: claims
  - id: identify-demo-brands
    rule: Name it plainly when it is shown (Yowie, a demo outdoor-gear brand); never imply a demo brand is a client.
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: claims
  - id: internal-scope-boundaries
    rule: These are internal boundaries for scoping the work, not lines for public copy.
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 9. What Agency State is not
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: claims
  - id: feedback-approval
    rule: Feedback records corrections and what was decided. A correction may fix one draft or lead to a change in the source, checks, or review paths. The person responsible for that decision approves the change before it is applied to future work.
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 2. What Agency State delivers
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: claims
  - id: feedback-owner-approval
    rule: Each correction is recorded with what was decided and why. If that decision calls for a change to the source, checks, or review paths, the owner of that decision approves the change before it's applied. Future work then uses the updated facts, rules, or review paths.
    severity: hard
    prov:
