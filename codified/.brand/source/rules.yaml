conditional_say:
  - words:
      - leverage
    condition: leverage as a noun (operational capacity)
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      condition: { src: 'brand-book, Agency State Brand Platform, 6. Vocabulary', conf: high, basis: confirmed }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
  - words:
      - may
      - might
    condition: '"May" and "might" are allowed when they describe a specific possibility or an evidence-based limit. Make clear what is uncertain; don''t strengthen a claim merely to avoid a hedge word.'
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
  - words:
      - no subscription, no vendor lock
      - no IT required
      - a Brand OS they own
    condition: 'If the buyer didn''t ask, don''t answer. The same goes for telling readers they will own what gets built ("a Brand OS they own"): ownership is implied.'
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
  - words:
      - AI strategy
    condition: 'Never say: Generic "AI strategy" as a deliverable.'
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      condition: { src: 'brand-book, Agency State Brand Platform, 7. Never say', conf: high, basis: confirmed }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    reason: Too abstract.
    instead: Name what is being built.
    route_to: voice
  - words:
      - Capability transfer
      - teaches you to build
    condition: 'Never say: "Capability transfer" or "teaches you to build" as promises.'
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      condition: { src: 'brand-book, Agency State Brand Platform, 7. Never say', conf: high, basis: confirmed }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    reason: Overstates what an engagement delivers. Greg builds with the team and provides artifacts and documentation, then works with the Brand OS lead as the system grows. That does not transfer capability in a single handoff.
    route_to: voice
  - words:
      - Unlike enterprise consulting...
      - not another AI course
      - most brands
      - most teams
      - everyone
      - nobody
    condition: 'No defining Agency State against others ("Unlike enterprise consulting...," "not another AI course") and no characterizing how other brands, teams, or people operate ("most brands," "most teams," "everyone," "nobody"). The defect is asserting a proportion nobody counted, or casting the reader''s peers as the ones getting it wrong. A specific, factual comparison is allowed: name the vendor or category, state what each approach does, and keep every claim verifiable; the superiority has to be visible in the facts, not asserted around them. Lead with what Agency State does, and state a failure by what goes wrong rather than by who has it.'
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: confirmed
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
  - words:
      - What about you?
      - let me know in the comments
    condition: 'Never say: Hedging filler ("in many ways," "at the end of the day") and CTA-bait closes (a rhetorical "What about you?", "let me know in the comments").'
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: confirmed
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      condition: { src: 'brand-book, Agency State Brand Platform, 7. Never say', conf: high, basis: confirmed }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
  - words:
      - honestly
      - to be honest
      - I'll be honest
      - truthfully
      - the honest answer
      - an honest look
      - the honest version
      - honesty ledger
    condition: Describing a property under verification is different and fine when a plainer word does not exist, though "accurate" usually does.
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: confirmed
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    reason: The straight-talk voice proves candor by being direct, so announcing it signals the opposite and reads as a filler tic.
    instead: Say the thing plainly.
    route_to: voice
  - words:
      - proof so far
      - the working parts
      - not yet proven
      - this is early
    condition: 'Never say: Repeated "proof so far," "the working parts," "not yet proven," "this is early." Scope once, plainly, then move on; repeating the hedge signals doubt and buries the claim. This does not relax the overclaim or fake-proof bans; it keeps honest scoping from turning into self-doubt.'
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: confirmed
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      condition: { src: 'brand-book, Agency State Brand Platform, 7. Never say', conf: high, basis: confirmed }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
  - words:
      - Brand OS
    condition: '"Brand OS" may label, never argue. No claim is true "because it is an operating system," and no copy derives a property from the metaphor (mandatory, total, invisible, "the layer everything runs through"). The test: replace "Brand OS" with "this setup" and every claim must still hold. The name is a handle for the assembled whole; the definition and the evidence carry the weight.'
    severity: soft
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: confirmed
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
formatting:
  - id: no-em-dashes
    rule: No em dashes. Recast with a comma, parentheses, or two sentences. Do not swap in a colon for the same break. Verbatim quotes keep their source punctuation.
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, Core rules
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
  - id: sentence-case
    rule: "**Sentence case for titles and labels.** Use sentence case for page titles,\n  section labels, cards, notes, buttons, and article titles. Preserve proper\n  nouns and fixed terms: Agency State, Brand OS, AI Enablement, Claude Code.\n  Short 11px monospace labels on the site (row numbers, card meta) may be set\n  in all caps as a small-label style (brand guidelines, Typography)."
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, Core rules
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    route_to: voice
  - id: no-performative-emphasis
    rule: No emphasis-by-italics, no exclamation, no transformation language.
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, Core rules
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
