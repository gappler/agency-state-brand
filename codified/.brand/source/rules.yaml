never_say:
  - words:
      - don't get left behind
      - AI is coming for your job
      - your competitors are already doing this
    kind: Fear framing
    severity: hard
    prov:
      src: brand-book, Agency State Brand Platform, 7. Never say
      conf: high
      basis: verbatim
    field_prov:
      severity: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      route_to: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    reason: Being plain about what AI automates, as the buyer's leverage, is not fear framing. The ban is on threatening the reader; honesty about the work is fine.
    route_to: voice
