    who: Agency State's audience is brand marketing leaders, and the builders on their teams, at mid-to-large B2B and B2C organizations with intentional brands, in-house or at the agencies that serve them. The sharpest fit is a team building its own AI workflows with Claude Code and Codex. The Brand OS gives those tools structured brand source to work with, checks on their output, and routes to the people who decide the remaining questions. A team that hasn't started with these tools can still fit if it is comfortable with technology, already uses AI, and plans to do more with it.
