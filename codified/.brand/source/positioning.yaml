what_it_is:
  statement: For brand marketing teams building their own AI workflows with Claude Code and Codex, Agency State is Greg Appler's AI Enablement practice. It builds the Brand OS that keeps the team's AI work on brand, drawing on more than twenty years of brand marketing leadership and hands-on building with the same tools.
  premise: 'AI Enablement is the discipline. Brand OS is its application to brand marketing: the system that makes the brand usable by AI, puts it to work, and keeps it governed as production grows.'
