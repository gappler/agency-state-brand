what_it_is:
  statement: 'For brand marketing leaders and the builders on their teams, in-house and at agencies, Agency State helps teams use AI in Claude Code and Codex to produce marketing work they can stand behind. Greg helps them give AI the brand guidance it needs, build automations and agents, and set up checks and human review, bringing Agency State''s Brand OS as the approach: one approved brand source AI can read, the automations and agents that source is served to, checks on their work, and people who review every draft, make the judgment calls, and approve updates. He draws on more than twenty years of brand marketing leadership and hands-on building with the same tools.'
  premise: 'Agency State works with a brand marketing team and its agencies on the brand guidance AI receives, the automations and agents that use it, and the checks and human review around them. Brand OS organizes that work in five parts: Source, Production, Control, Feedback, and Operators. An engagement can cover one part of that work or all of it.'
  prov:
    src: brand-book, Agency State Brand Platform, 3. Positioning
    conf: high
    basis: verbatim
  field_prov:
    premise:
      src: brand-book, Agency State Brand Platform, 2. What Agency State delivers
      conf: high
      basis: verbatim
personas:
  - name: brand marketing leaders, and the builders on their teams
    who: Agency State's audience is brand marketing leaders, and the builders on their teams, at mid-to-large organizations with established, intentional brands, B2B or consumer, in-house or at the agencies that serve them. The team has to be willing to maintain a shared brand source. A brand book helps but is not required; the brand-readiness assessment works from the brand's existing written and visual material and the work it has shipped. The sharpest fit is a team building its own AI workflows with Claude Code and Codex. Brand OS gives those tools structured brand source to work with, checks on their output, and people who review the work and decide the remaining questions. A team that hasn't started with these tools can still fit if it is comfortable with technology, already uses AI, and plans to do more with it.
