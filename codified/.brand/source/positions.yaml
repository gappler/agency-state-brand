schema_version: 0.2.0
positions:
  - id: checks-have-scope
    stance: "**Control** separates what a machine can check from what a person should decide. Automated checks use the same approved source to flag potential errors, and passing a check establishes only what it tested. A person on the team reviews every draft. The reviewer receives the draft with the check results, any limits the checks report, and the questions that need human judgment, such as whether the work emphasizes the right benefits, fits the campaign, and sounds like the brand. Decision owners get the questions the reviewer cannot settle."
    prov:
      src: brand-book, Agency State Brand Platform, 2. What Agency State delivers
      conf: high
      basis: verbatim
    owner: Greg Appler
    field_prov:
      owner: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      date: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    date: '2026-10-27'
  - id: corrections-need-decisions
    stance: A correction to a draft shouldn't automatically become a change to the brand. The problem may be an error in the draft, a case that calls for an exception, stale source material, or a rule that's too loose, too strict, or missing.
    prov:
      src: brand-book, What is Brand OS?, 04. Feedback
      conf: high
      basis: verbatim
    owner: Greg Appler
    field_prov:
      owner: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      date: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    date: '2026-10-27'
  - id: voice-fit-needs-judgment
    stance: "Voice needs human review. In a recent study of three Claude models and one brand, the models given the brand's voice to imitate still wrote in their own voice."
    prov:
      src: brand-book, What is Brand OS?, 03. Control
      conf: high
      basis: verbatim
    owner: Greg Appler
    field_prov:
      owner: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      date: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    date: '2026-10-27'
  - id: leave-undecided-content-empty
    stance: "During codification, each entry is filled from the brand's existing material. What the material doesn't settle goes to the person who decides it."
    prov:
      src: brand-book, A codified brand template, The baseline
      conf: high
      basis: verbatim
    owner: Greg Appler
    field_prov:
      owner: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      date: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    date: '2026-10-27'
  - id: feedback-needs-owner-approval
    stance: "Each correction is recorded with what was decided and why. If that decision calls for a change to the source, checks, or review process, the owner of that decision approves the change before it's applied. Accepted changes go back into the source, checks, or review process, and the next draft uses the change. We use approved updates to improve how the system represents the brand and keep it current as the brand changes."
    prov:
      src: brand-book, What is Brand OS?, 04. Feedback
      conf: high
      basis: verbatim
    owner: Greg Appler
    field_prov:
      owner: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
      date: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
    date: '2026-10-27'
