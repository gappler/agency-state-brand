claims:
  - id: principal-experience
    claim: "More than two decades leading brand marketing strategy, operations, and teams, most recently a decade running national marketing at The American Institute of Architects as Managing Director of Brand & Strategic Marketing, where he led record-breaking membership and conference campaigns and marketing for continuing education, built a 12-person multidisciplinary team, modernized marketing operations, designed the product and led the technology project for AIAU, the organization's on-demand continuing education platform, and was business owner for a rebrand adopted across the national organization and chapter network (messaging strategy by marketing staff; visual identity by Pentagram). Earlier, six years as VP of Digital Marketing at GRAFIK, an agency in Alexandria, Virginia, on B2B clients including Autodesk and Accenture; before that, digital account director at Designory leading US digital marketing for Nissan and Infiniti (national brand marketing, plus materials and guidance for dealer sales events), Lincoln Mercury at Young & Rubicam, and in-house at Bacardi Global Brands, where he supported local-market digital promotions and built bar.tv, a global drinks website (since decommissioned). His whole career has been agency-side or in-house on brand clients; at the AIA he ran the team as an in-house agency. He is a business leader in digital: he builds teams and the processes they run on, and the strategies and marketing plans that connect campaigns to the business. Earlier in his career he wrote code, building CD-ROM games, presentations, and kiosks. He is a builder at heart. For the past two years he has been building with Claude Code, and more recently Codex, as well as other automation tools: Agency State's Brand OS, the codified Agency State brand and its MCP server, review panels, and tests on demo brands. He has also been building a campaign engine, in which agents run a marketing campaign through phases with a person approving the key pieces between each one; it is still in development and has been tested on fictional organizations. He also has a few AI products of his own in the works. None of this work has been used with a client."
    prov:
      src: brand-book, Agency State Brand Platform, 8. Proof
      conf: high
      basis: confirmed
    conditions: No copy claims or implies client results, measured accuracy, or a full Brand OS running in production for anyone.
