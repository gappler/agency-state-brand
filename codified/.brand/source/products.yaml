claims:
  - id: principal-experience
    claim: 'More than two decades leading brand marketing strategy, operations, and teams, most recently a decade running national marketing at The American Institute of Architects as Managing Director of Brand & Strategic Marketing, where he led marketing for membership, the national conference, and continuing education, built a twelve-member multidisciplinary team, modernized marketing operations, designed the product and led the technology project for AIAU, the organization''s on-demand continuing education platform, and was business owner for a brand redesign adopted at the national organization and across the chapter network (messaging strategy by marketing staff; visual identity in collaboration with Pentagram). Earlier, ran US digital marketing for Lincoln, Nissan, and Infiniti; for Bacardi Global Brands, supported local-market digital promotions and built bar.tv, a global drinks website (since decommissioned). He is a business leader in digital: he builds teams and the processes they run on, and the strategies and marketing plans that connect campaigns to the business. Earlier in his career he wrote code, building CD-ROM games, presentations, and kiosks. He is a builder at heart. For the past two years he has been building with Claude Code, and more recently Codex, as well as other automation tools: a campaign engine, still in development, in which agents run a marketing campaign through phases with a person approving the key pieces between each one, BrandBuilder (the codification and checking engine, in testing on demo brands) and the brand''s own MCP server, review panels, and tests on demo brands. He also has a few AI products of his own in the works. The campaign engine and BrandBuilder have been tested on fictional organizations and demo brands; none of it has been used with a client.'
    prov:
      src: brand-book, Agency State Brand Platform, 8. Proof
      conf: high
      basis: confirmed
    conditions: No copy claims or implies client results.
  - id: brand-os-built-parts
    claim: The Brand OS parts are built and tested on Agency State's own work and on demo brands.
    prov:
      src: brand-book, Agency State Brand Platform, 8. Proof
      conf: high
