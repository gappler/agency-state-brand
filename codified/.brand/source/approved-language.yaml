blocks:
  - id: definition-artifacts
    kind: passage
    text: '**Artifacts.** The reusable units an engagement produces: prompts, skills, agents, workflows, integrations, documentation. Team-portable.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
