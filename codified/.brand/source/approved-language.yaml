  - id: published-serving-your-brand-to-ai-tools-the-job
    kind: passage
    text: "MCP is an open standard for connecting AI tools to outside data. For a brand, MCP serves marketing tools the brand material they need for the task, from voice guidance to the full platform.\n\n    serving layer:\n      source stays governed\n      tools ask for the right slice\n      responses stay scoped to the task\n      checks use the same source drafts use\n      updates happen in one place"
    remix: false
    prov:
      src: brand-book, Serving your brand to AI tools, The job
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, Serving your brand to AI tools, The job', conf: high, basis: confirmed }
  - id: published-serving-your-brand-to-ai-tools-source-and-server
    kind: passage
    text: "The source and the server are different things.\n\nThe source is approved brand material, including structured files, provenance, rules, decisions, and review notes. The server reads it and answers requests from tools.\n\nThe team governs the brand material. The server handles access, caching, tool names, response formats, and connections.\n\n    pattern:\n      brand source:\n        maintained by the team\n        reviewed and versioned\n        structured for drafting and checks\n\n      MCP server:\n        reads the source\n        exposes useful tools\n        returns scoped answers\n        connects to agents and workflows"
    remix: false
    prov:
      src: brand-book, Serving your brand to AI tools, Source and server
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, Serving your brand to AI tools, Source and server', conf: high, basis: confirmed }
  - id: published-serving-your-brand-to-ai-tools-what-tools-ask-for
    kind: passage
    text: "Writing, review, and page builds each call for different brand material. A workflow handling an exception can request the decision owner.\n\nConnecting a server makes its tools available, but an agent still needs instructions to request the right part. The workflow says what to request and when.\n\n    requests by task:\n      writing:     voice, never-say list\n      review:      claims, proof, product facts\n      page build:  visual rules\n      exception:   the decision owner"
    remix: false
    prov:
      src: brand-book, Serving your brand to AI tools, What tools ask for
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, Serving your brand to AI tools, What tools ask for', conf: high, basis: confirmed }
  - id: published-serving-your-brand-to-ai-tools-serving-agency-states-brand
    kind: passage
    text: "My brand is codified as structured brand files, reviewed by me on October 27, 2026, and served through an MCP server. A writing tool can request the phrases I rule out and how strictly each is treated.\n\n    request:\n      get_never_say()\n\n    response excerpts:\n      word:      10x your output\n      severity:  hard\n\n      word:      unlock\n      severity:  hard\n\n      word:      AI-powered\n      severity:  hard\n\nA request for the claims decision owner returns my name, along with the brand's review status.\n\n    request:\n      get_decision_owner(decision_class=\"claims\")\n\n    response excerpts:\n      class:          claims\n      owner:          Greg Appler\n      brand_status:\n        approval:     human_reviewed\n\n    the pattern:\n      assess:   score the brand inventory\n      codify:   build the reviewed source\n      serve:    expose the source to agents and workflows\n      produce:  draft and adapt from the source\n      check:    compare output to the source\n      review:   a person reviews each draft\n      route:    send questions the reviewer cannot settle to the decision owner\n      update:   return approved corrections to the source"
    remix: false
    prov:
      src: brand-book, Serving your brand to AI tools, Serving Agency State's brand
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review-sheet B2 (Greg Appler, 2026-10-27: published passages, no rewording), applied 2026-11-02 to an updated passage', conf: high, basis: confirmed }
  - id: published-serving-your-brand-to-ai-tools-why-it-matters
    kind: passage
    text: 'Brand copies in prompts, custom assistants, and agency decks can age differently.


      Serving one source lets people update the brand material that automations and agents use for both drafting and checking.


      MCP handles the connection. The brand work is deciding what the source contains, how to serve it, and who answers questions the source leaves open.'
    remix: false
    prov:
      src: brand-book, Serving your brand to AI tools, Why it matters
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, Serving your brand to AI tools, Why it matters', conf: high, basis: confirmed }
