  - id: definition-workflow
    kind: passage
    text: '**Workflow.** The process itself, what the team actually runs. Active vocabulary for what gets built.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-codified-brand
    kind: passage
    text: '**Codified brand.** The existing brand expressed as structured source a machine can read and a team can govern: positioning, audiences, voice, vocabulary, claims, products, proof, visual rules, and brand decisions. It is built from the team''s written material and approved work, then compiled into the files a model reads and the checks use. Each entry records where it came from and whether it was stated or inferred. Inferences, conflicts, and gaps go to the people who decide them for review. The codified brand is Source, one of the five parts of Brand OS; it does not replace the team''s brand development work.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-brand-os
    kind: passage
    text: "**Brand OS.** One brand source AI can read, the automations and agents that source is served to, checks on their work, and the people who make the judgment calls. In five parts: Source (the codified brand), Production (the automations and agents that make the team's work), Control (checks against the source and the brand's rules, with routes for judgment), Feedback (approved updates to source, checks, and review paths), and Operators (the people who make the decisions and keep the system current). Agency State builds it with the team, then works closely with its Brand OS lead to measure how well the AI work holds to the brand, improve the source and checks, and extend the system."
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-brand-os-lead
    kind: passage
    text: '**Brand OS lead.** The person on the team who looks after the process that keeps its AI work on brand, including adoption, team communications, and keeping the source current. The lead works with the people responsible for brand, product, claims, and design decisions. On a small team, one person may fill several roles.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-agents
    kind: passage
    text: '**Agents.** In Production, the agents that make the team''s work from a brief, with the codified brand supplying the brand side. In Control, review agents read what the team ships and flag what is off-brand before it goes out; a review panel is several review agents reading the same work, each on a different lens. Say "automations and agents" for Production as a whole.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-automations
    kind: passage
    text: '**Automations.** In Production, the steps that run on their own when something triggers them, with no choices along the way: updating a changed fact everywhere it appears, running the checks, sending each version for review. Agents make the choices within a brief; automations carry the set steps around them. Say "automations and agents" for Production as a whole; use one word alone only when the sentence describes that kind of work.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-brandbuilder
    kind: passage
    text: "**BrandBuilder.** Agency State's codification tool. Use **Agency State's BrandBuilder** on first reference; use **BrandBuilder** after that. It turns organized brand material into structured brand files for the team to review, then compiles the reviewed source into the compiled contracts a model reads and the checks use, and runs the checks and routing around that source. One word, both capitals: BrandBuilder."
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-brand-readiness-assessment
    kind: passage
    text: "**Brand-readiness assessment.** The public name for the first step with a team. It establishes whether the brand is ready to codify, what needs deciding first, and what is worth building."
    remix: false
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'conservative default for a new definition; review-sheet B2 allowed remix for the 15 definitions reviewed 2026-10-27, and this one awaits that decision', conf: high, basis: confirmed }
  - id: definition-provenance
    kind: passage
    text: '**Provenance.** Whether the codified brand''s own source labels are honest: did a rule marked as verbatim actually appear in the source, does a cited section exist. A check on the codified brand and its source labels, not on generated copy. Distinct from a source check.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-rule-check
    kind: passage
    text: '**Rule check.** A deterministic check that tests finished copy or markup against rules the brand has already settled: banned words, required claim conditions, approved colors, fonts, product names. It has a right answer and does not wait for a person. Say "rule check" in client copy, not "the linter."'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-source-check
    kind: passage
    text: '**Source check.** A check of whether a claim points to something real, for example whether a named product exists in the catalog. It is triage: it flags where to look, it does not declare a flagged item false.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-serving-layer-mcp
    kind: passage
    text: '**Serving layer (MCP).** The client-run server that serves the codified brand into the tools where the work happens, exposing it as context and checks. Say "serving layer" in prose; "a client-run MCP server" when naming the mechanism.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-demo-brand
    kind: passage
    text: '**Demo brand.** A practice brand built to exercise the system, shaped like a real one, with a brand book, product facts, voice, and visual rules. Name it plainly when it is shown (Yowie, a demo outdoor-gear brand); never imply a demo brand is a client.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: definition-recurring-work
    kind: passage
    text: '**Recurring work.** The marketing work that comes around regularly (formats, adaptations, channel versions), which Production takes on so the team spends its time on higher-impact work. "Recurring" means it happens regularly, not that it is done identically.'
    remix: true
    prov:
      src: brand-book, Agency State Brand Platform, 6. Vocabulary
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'review by Greg Appler, 2026-10-27', conf: high, basis: authored }
  - id: published-what-is-brand-os
    kind: passage
    text: "*A Brand OS is one brand source AI can read, the automations and agents that source is served to, checks on their work, and the people who make the judgment calls.*"
    remix: false
    prov:
      src: brand-book, What is Brand OS?
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What is Brand OS?', conf: high, basis: confirmed }
  - id: published-what-is-brand-os-why-it-matters
    kind: passage
    text: "Leaders in the [2026 CMO Survey](https://cmosurvey-new.fuqua.duke.edu/wp-content/uploads/2026/03/The_CMO_Survey-Highlights_and_Insights_Report-2026.pdf) say they use AI in about a quarter of their marketing today and expect it in more than half within three years. Agencies and brand teams still answer for what ships. I build Brand OS with teams to give their AI work a brand source, checks against it, and people who review every draft. With it, the team has a basis for deciding whether the work represents its brand and is ready to ship.\n\nA Brand OS has five parts. The codified brand comes first; the other four put it to work and keep it current.\n\n```text\nBrand OS:\n  source:      the codified brand\n  production:  automations and agents that make the work\n  control:     checks against the source and the brand's rules\n  feedback:    approved updates to source, checks, and review paths\n  operators:   people who make the judgment calls and keep the source current\n```"
    remix: false
    prov:
      src: brand-book, What is Brand OS?, Why it matters
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What is Brand OS?, Why it matters', conf: high, basis: confirmed }
  - id: published-what-is-brand-os-01-source
    kind: passage
    text: "The source brings the team's brand decisions together in material AI can read and the team can govern. It records who the brand is for, what it can claim, and how it looks and sounds, with the facts and evidence behind those decisions. Production and review work from the same brand information.\n\nFor a product launch, the source records the team's decisions about the facts and rules used in the product page, sales email, paid search copy, social posts, and internal review notes.\n\n```text\nlaunch source:\n  product facts:     specifications, availability, names, compatibility\n  claims:            approved language, evidence, required conditions\n  voice:             vocabulary, banned words, channel differences\n  visual:            color, type, logo, layout, image rules\n  provenance:        source, stated or inferred, confidence, reviewer, date\n  open questions:    gaps, conflicts, inferred items, decisions needed\n```\n\nEach automation or agent is served the parts of the source its task needs through MCP, an open standard for connecting AI tools to outside data. For agencies serving multiple clients, each client brand has its own source."
    remix: false
    prov:
      src: brand-book, What is Brand OS?, 01. Source
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What is Brand OS?, 01. Source', conf: high, basis: confirmed }
  - id: published-what-is-brand-os-02-production
    kind: passage
    text: "Production is where the team's work gets made. The team supplies the brief and the idea; the source supplies the brand guidance for the task. The work covers campaigns and the ongoing production between them: product updates, page revisions, email versions, social posts.\n\nAgents draft, adapt, localize, and update that material. An email and a social post call for different choices about length, emphasis, and detail, and the agent makes those choices within the brief. Automations handle the set steps around each draft. They run the checks and send the draft to the person who reviews it.\n\n```text\nproduction flow:\n  from the team:     brief, idea, audience, deadline\n  from the source:   facts, approved claims, voice, visual rules\n  agents make:       product page, paid search, email, social, partner copy\n  automations:       run the checks, send each draft for review\n  to a person:       a review brief with the choices to make\n```"
    remix: false
    prov:
      src: brand-book, What is Brand OS?, 02. Production
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What is Brand OS?, 02. Production', conf: high, basis: confirmed }
  - id: published-what-is-brand-os-03-control
    kind: passage
    text: "Control separates what a machine can check from what a person should decide. Some questions have a right answer: whether a banned word appears, whether a claim includes its required condition, whether a product is in the catalog, and whether a color is in the approved palette.\n\nA check answers the question it was built to ask, and passing it establishes only what it tested. In [a test I ran with Yowie](context-is-not-control.html), a demo outdoor-gear brand, Claude was asked for a cooler Yowie doesn't make and wrote a full product page for it. The page passed every rule check; only a check against the product list caught it. In the same test, a customer reply promised warranty terms the source didn't have, and none of the checks in that test caught them.\n\n```text\ncheck result (Yowie demo-brand test):\n  draft:          product page for the Slab 45QT cooler\n  rule checks:    passed (banned words, punctuation, claim conditions)\n  source check:   flagged; Slab 45QT is not in the catalog\n```\n\nVoice needs human review. In a recent study of three Claude models and one brand, the models given the brand's voice to imitate still wrote in their own voice.\n\n“Instructed to imitate a brand voice, the models remain almost perfectly separable from the brand's held-out text on style-only instruments. Asked to predict their own style, every model missed more often than it hit.”\n\nVictor A. Barger, [“Does AI Have a Voice?”](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7248819) working paper, 2026 (tested on three Claude models and one brand)\n\nOther questions have no right answer. A claim may be technically allowed but weak. The voice may fit the rules and still sound wrong for the campaign. An image may follow the guidelines and still miss the brand. The checks run first. A person on the team reviews every draft, judges whether it looks and sounds like the brand and whether an allowed claim is worth making, and catches anything the checks missed. Decision owners get the questions the reviewer can't settle.\n\n```text\nfor the reviewer:\n  is this claim worth making?\n  does the voice fit this campaign?\n  does the image fit the brand?\n  what have the checks missed?\n```"
    remix: false
    prov:
      src: brand-book, What is Brand OS?, 03. Control
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What is Brand OS?, 03. Control', conf: high, basis: confirmed }
  - id: published-what-is-brand-os-04-feedback
    kind: passage
    text: "A correction to a draft shouldn't automatically become a change to the brand. The problem may be an error in the draft, a case that calls for an exception, stale source material, or a rule that's too loose, too strict, or missing.\n\nEach correction is recorded with what was decided and why. If that decision calls for a change to the source, checks, or review process, the owner of that decision approves the change before it's applied. Accepted changes go back into the source, checks, or review process, and the next draft uses the change.\n\n```text\nfeedback outcomes:\n  draft correction:     fix this draft\n  approved exception:   record who approved the exception and why\n  source update:        change the fact or approved language\n  rule update:          add or revise a check\n  routing update:       send this question to the right owner\n```"
    remix: false
    prov:
      src: brand-book, What is Brand OS?, 04. Feedback
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What is Brand OS?, 04. Feedback', conf: high, basis: confirmed }
  - id: published-what-is-brand-os-05-operators
    kind: passage
    text: "People make the brand decisions. They decide which exceptions are allowed, which rules should be enforced, and when source material needs updating.\n\nRoles like the brand owner, product owner, claims owner, design owner, and Brand OS lead each take the decisions in their area. On a small team, one person may hold several roles. A reviewer sees every draft, and decision owners settle the questions the reviewer can't answer. Decision owners also keep the source current as changes are approved.\n\n```text\noperators (example roles):\n  brand owner:       voice, positioning, boundaries\n  product owner:     facts, specifications, availability\n  claims owner:      approved claims, evidence, conditions\n  design owner:      visual rules and exceptions\n  Brand OS lead:     adoption, team communications, keeping the source current\n```"
    remix: false
    prov:
      src: brand-book, What is Brand OS?, 05. Operators
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What is Brand OS?, 05. Operators', conf: high, basis: confirmed }
  - id: published-what-is-brand-os-how-i-work-with-a-team
    kind: passage
    text: "I start by assessing the brand as it's written down and as it shows up in the work. The brand itself stays with the team and its agencies. I organize the material with them and bring disagreements and gaps to the people who decide them. Agency State's BrandBuilder turns that material into structured brand files for the team to review. Once approved, those files give the team's AI work its brand source. BrandBuilder runs the checks and routing around that source.\n\nOnce the source is approved and being served, I work with the team to set up the first production automations and agents, how every draft is reviewed, and how results are reported. From there I work closely with the team, especially its Brand OS lead, tracking where the AI work misses the brand, fixing the source and checks behind each miss, and extending the system to more of the team's work.\n\nTo request a brand-readiness assessment, send me an email."
    remix: false
    prov:
      src: brand-book, What is Brand OS?, How I work with a team
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What is Brand OS?, How I work with a team', conf: high, basis: confirmed }
  - id: published-context-is-not-control
    kind: passage
    text: "*Brand documents shaped how Claude's copy sounded. They didn't stop it from inventing a cooler.*\n\nGiving AI your written brand documents can help it write better marketing copy. Those documents become its context: the vocabulary, examples of the voice, product information, and the rules you want it to follow.\n\nBut a draft it writes can sound right while getting important things wrong. It can name a product you don't sell or promise a policy you don't offer. I've found these errors are different from the ones people make. They fit. They borrow real details, or they sound like what any brand like yours would say. The clues that they're wrong are there, but only someone who knows the facts will see them.\n\nIn a test with Yowie, a demo outdoor-gear brand, I gave Claude Opus 5 the brand information and product catalog, then sent it marketing requests that included misleading product details.\n\nI ran two kinds of automated checks on every draft. Rule checks looked for banned words, exclamation points, and missing conditions on ice-retention claims. A source check found the model names in each draft, such as Slab 35QT, and looked them up in the catalog.\n\nThirty-six of the requests asked for a product that wasn't in the catalog. In 33 of them, Claude corrected the request, chose a real product, or avoided naming one. That was the right response.\n\nBut in three drafts, Claude went along with the request. One was a full product page for the Slab 45QT, a cooler that wasn't in Yowie's catalog. Claude invented a weight, dimensions, and a price.\n\n    check result:\n      draft:          product page for the Slab 45QT cooler\n      rule checks:    passed\n      source check:   flagged; Slab 45QT is not in the catalog\n\nThe catalog had a Slab 35QT, and Claude built the fake cooler out of it. The real 35QT weighs 22 lb and costs $285. The invented 45QT weighs 28 lb and costs $335. The page also reused the 35QT's ice-retention claim, 5+ days at 90°F, and because that claim named its test conditions, the page passed the rule checks. The fake was convincing because it was built partly from Yowie's real product information. It did leave a clue. The page called the 45QT \"the larger of the two Slab sizes,\" though Yowie makes a single size. You'd catch that only if you knew the catalog.\n\nAll three fake drafts passed the rule checks, and the source check flagged all three. The rule checks asked whether the copy followed the brand's rules, and it did. The source check asked whether the product existed, and it didn't. This was one test on one brand with a short catalog, and a missing product is one of the easier errors for a check to spot.\n\nThe brand information gave Claude context, and that context did most of the work. Claude got 33 of the 36 right, and the three it got wrong looked just as finished as the rest. The brand information shaped how the page sounded, but it didn't control everything the page claimed. To know what's been checked, you have to know what each check asked."
    remix: false
    prov:
      src: brand-book, Context is not control
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, Context is not control', conf: high, basis: confirmed }
  - id: published-context-is-not-control-what-a-check-can-tell-you
    kind: passage
    text: 'Some brand requirements are straightforward to check, such as whether a banned word appears or a color matches an approved value. If an approved claim requires an exact disclosure, a check can confirm it''s there.


      Other errors have nothing to be checked against. One request asked for a reply about warranty options to a customer with a snagging zipper on a Burrow 20F sleeping bag. Claude correctly said Yowie doesn''t make a Burrow 20F, and the source check flagged that name. But the reply also promised a free repair or replacement, shipping both ways, and a two-to-three-week turnaround. Yowie''s brand information has no warranty terms, so none of the checks in this test could catch those promises.


      Finding a product in the catalog doesn''t mean the draft describes its performance accurately. That requires comparing the draft''s claims with the relevant product specifications. And for a claim about how long a cooler keeps ice, that means checking both the stated duration and the conditions used to test the product.


      Some decisions need a person''s judgment even when the facts are correct. A campaign can follow the vocabulary rules and still feel wrong. An approved claim can be a poor choice for a particular audience. A legal exception needs someone authorized to approve it.'
    remix: false
    prov:
      src: brand-book, Context is not control, What a check can tell you
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, Context is not control, What a check can tell you', conf: high, basis: confirmed }
  - id: published-context-is-not-control-where-the-corrections-go
    kind: passage
    text: 'When someone on the team reviews a draft and corrects it, the corrections can reveal problems in the brand information the AI is working from.


      If an old product fact keeps appearing, check whether the brand information still contains it. If the team keeps making the same edit, decide where the fix belongs. A phrase that should never appear belongs in the rules. A preference for how the copy should sound belongs in the voice guidance, supported by examples. Exact wording the team wants reused belongs in approved material. A mistake that should be caught on every draft belongs in a check.


      If the team keeps approving an exception to a rule, someone needs to decide when that exception is allowed and record the decision.


      The brand information gives AI context. Control comes from the checks around it and the people who make the calls the checks can''t. That''s the work a Brand OS does: turning the brand information into a source a check can read, keeping it current, giving it to the AI with every request, running the checks, and routing the remaining decisions to the right person.'
    remix: false
    prov:
      src: brand-book, Context is not control, Where the corrections go
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, Context is not control, Where the corrections go', conf: high, basis: confirmed }
