  - id: published-what-ai-needs-to-know-about-your-brand-the-inventory
    kind: passage
    text: "A codified brand expresses the brand as source: structured decisions a machine can read, a person can review, and a system can check against.\n\nThe inventory below is the baseline I use for Agency State's BrandBuilder and assessment work: 46 slots, of which 34 are required, 11 recommended, and 1 optional. Each slot is scored as filled, partial, empty, or not applicable. That turns the work into a gap report instead of an impression. The checklist measures coverage; whether each entry is accurate, current, and approved still takes review.\n\nThe 46 are a starting point, not a closed list. A brand can add slots for what it needs, scored and tiered the same way, and mark any that don't apply.\n\n    assessment status:\n      filled:   current, sourced, ready to codify\n      partial:  exists, but stale, scattered, or unsourced\n      empty:    the brand has not decided\n      n/a:      this brand does not need it"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, The inventory
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, The inventory', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-identity-and-architecture
    kind: passage
    text: "This material records the name, the lines, the values, and the way products or sub-brands relate to the parent brand. The work is making the rules explicit enough for a system to use.\n\n    identity:\n      required:\n        - brand name and usage rules\n        - tagline, positioning line, and preview line\n        - what the name means, and what it does not mean\n      recommended:\n        - values as stated in the brand book\n        - mission or purpose, if the brand uses one\n    \n    architecture:\n      recommended:\n        - product and sub-brand naming structure\n        - capitalization rules\n        - names that may never be abbreviated"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, Identity and architecture
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, Identity and architecture', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-positioning-and-positions
    kind: passage
    text: "Positioning states where the brand sits: audience, category, differentiators, and the basis for those claims. Positions are different. They are the brand's chosen perspectives, the category debates it takes a side in, and the things it deliberately disagrees with.\n\nBoth matter. Positioning keeps the brand legible. Positions give the brand a point of view.\n\n    positioning:\n      required:\n        - positioning statement\n        - audience definition\n        - category\n        - differentiators, stated as claims with their basis\n      optional:\n        - named competitor facts, factual and verifiable\n    \n    positions:\n      recommended:\n        - what the brand believes\n        - category debates it takes a side in\n        - what it deliberately disagrees with\n        - owner and date for each position"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, Positioning and positions
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, Positioning and positions', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-voice
    kind: passage
    text: "Voice needs both rules and examples. Data points give the system checkable habits: preferred words, banned words, punctuation, formatting, reading level, and register shifts. Exemplars give the model whole passages the team agrees sound right.\n\nVoice judgment still belongs to a person. A system can catch banned words and formatting errors. It cannot decide whether a line has the right feel for the brand.\n\n    voice:\n      required:\n        - preferred and banned words\n        - sentence-length tendency and reading level\n        - person: first, second, or third\n        - punctuation and formatting rules\n        - style guide of record and house exceptions\n        - 3-5 whole-passage exemplars, kept verbatim\n      recommended:\n        - register splits\n        - channel variations, stated as differences from the core voice"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, Voice
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, Voice', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-visual-identity
    kind: passage
    text: "Visual identity belongs in the source when it can be stated as values, files, and rules. Exact values make part of it checkable: BrandBuilder compares the color values and font families in a page's code with the approved palette and typefaces. It doesn't look at the rendered page.\n\nEvery brand also builds a website, so spacing, imagery, and iconography are required as well. They are guidance, not checks. The system serves them to whoever builds the page, but whether a layout or an icon fits the brand is a call for a person.\n\n    visual:\n      required, checked:\n        - palette with exact values\n        - typeface families\n      required, guidance:\n        - typeface weights\n        - logo usage rules\n        - spacing and layout rules\n        - imagery and illustration direction\n        - iconography"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, Visual identity
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, Visual identity', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-products-and-claims
    kind: passage
    text: "This is where many AI mistakes start. The model names an old product, invents a specification, drops a required condition, or repeats a claim without its proof. Product facts and claims need to sit together so the system knows what may be said and what must travel with it.\n\nSuppose an approved offer says “Free returns within 30 days. Final-sale items excluded.” Keeping only “Free returns” changes the offer. The time limit and the exclusion stay with the claim.\n\n    products:\n      required:\n        - product list with status: active or retired\n        - facts copy may state\n        - specifications and names\n        - price policy, or a route to a person\n        - approved claims per product\n        - required conditions for each claim"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, Products and claims
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, Products and claims', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-approved-language-and-stories
    kind: passage
    text: "Some language should be reused as approved: company descriptions, disclosures, legal language, attributions, and published passages the team already trusts. Stories are stored separately, tagged so the right story can be served for the right job.\n\n    approved language:\n      required:\n        - company descriptions at 25, 50, and 100 words, and full length\n        - legal and disclosure language\n        - required attributions\n      recommended:\n        - best published passages worth remixing\n        - provenance and usage conditions for each passage\n    \n    stories:\n      recommended:\n        - origin story\n        - named case anecdotes\n        - mistakes the brand learned from\n        - tags for topic, audience, and length"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, Approved language and stories
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, Approved language and stories', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-rules
    kind: passage
    text: "Rules are the part of the source a check can enforce or route. They need to be specific, sourced, and clear about their basis. A rule can come verbatim from the brand material, be inferred during codification, or be decided by the team during review.\n\nConditions matter. A word allowed in a quoted customer review can still be banned in the brand's own claims, and the rule records that difference.\n\n    rules:\n      required:\n        - never-say list\n        - claim conditions\n        - formatting rules\n      recommended:\n        - conditional rules with precise conditions\n    \n    each rule records:\n      source:  where it came from\n      basis:   verbatim, inferred, or decided\n      route:   check automatically or send to a person"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, Rules
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, Rules', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-decision-owners-and-review
    kind: passage
    text: "Decision owners are the people with authority over each kind of judgment: voice decisions, claim approvals, visual exceptions, legal review, and source updates. The team names them. When a check can't settle a question, it goes to them. The Brand OS lead looks after the process and works with the owners to keep the source current.\n\nThe review ledger holds what codification found but could not decide: inferred rules, conflicting sources, stale material, missing proof, and decisions left for the team.\n\n    decision owners:\n      required:\n        - owner for voice decisions\n        - owner for claim approvals\n        - owner for visual exceptions\n        - owner for legal review\n        - owner for source updates\n    \n    needs review:\n      required:\n        - inferences made during codification\n        - conflicts found in the source material\n        - stale or unsourced entries\n        - decisions left for a person"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, Decision owners and review
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, Decision owners and review', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-what-stays-out
    kind: passage
    text: "The source should make gaps visible. If the brand has not decided something, the slot stays empty and routes to a person. The codifier does not invent the answer.\n\nVoice scoring stays out too. Exemplars and rules can improve generation, and checks can catch specific errors, but voice fit remains a judgment call. The system should route that question to a person.\n\n    kept out:\n      invented content:    empty slots stay empty\n      brand creation:      undecided brands need strategy first\n      voice scoring:       judgment routes to a person\n      stale live values:   prices and fast-changing facts route to an owner"
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, What stays out
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, What stays out', conf: high, basis: confirmed }
  - id: published-what-ai-needs-to-know-about-your-brand-the-output
    kind: passage
    text: 'The useful output is a reviewed source the team can run on: structured brand files, provenance, gaps, conflicts, and the decisions the team needs to make before the source becomes authoritative.


      That is why the work starts with an assessment. The assessment shows what can be codified now, what needs a decision first, and which automations should wait until the source is ready.'
    remix: false
    prov:
      src: brand-book, What AI needs to know about your brand, The output
      conf: high
      basis: verbatim
    field_prov:
      remix: { src: 'brand-book, What AI needs to know about your brand, The output', conf: high, basis: confirmed }
