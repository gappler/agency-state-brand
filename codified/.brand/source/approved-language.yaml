  - id: published-what-ai-needs-to-know-about-your-brand-the-baseline
    kind: passage
    text: "This is the baseline I start from when preparing a brand for AI tools: 46 entries, 34 required, 11 recommended, and one optional. It's a template, not a closed list. A brand can add entries its work needs, and entries that don't apply are marked not applicable and set aside. During codification, each entry is filled from the brand's existing material. What the material doesn't settle goes to the person who decides it.\n\n    assessment status:\n      filled:   current, sourced, ready to codify\n      partial:  exists, but stale, scattered, or unsourced\n      empty:    the brand has not decided\n      n/a:      this brand does not need it"
    remix: false
